# SSX Tricky courses in SSX 3. The engine builds the Select Peak rows from
# the peak and event tables below (no menu code in the plugin); `world` is the
# location name the importer gives each course archive (tools/prepare_tricky_tracks.py
# `world_name`). Names are listed under Race / Freestyle, so no suffix.
[plugin]
id = "tricky"
api = "0.1"
name = "SSX Tricky courses"

[inputs]
disc = { serials = ["SLUS-20326"] }

[prepare]
command = ["python3", "prepare/prepare.py"]

[code]
package = "ssx3-plugin-tricky"

[[peak]]
id = "tricky"
name = "Peak Tricky"
picture = "ui/tricky.png"   # made by the importer into $SSX3_PLUGIN_OUT (the Tricky logo)

[[event]]
id = "garibaldi"
name = "Garibaldi"
peak = "tricky"
kind = "race"
template = "ARA1"
world = "TR_GARI_R"

[[event]]
id = "garibaldi-freestyle"
name = "Garibaldi"
peak = "tricky"
kind = "freestyle"
template = "ASS1"
world = "TR_GARI_F"

