name: No game material present

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-game-material:
    name: Assert no game material is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that no disc, executable or translated code is tracked
        run: |
          bad=$(git ls-files | grep -Ei '\.iso$|^orig/|^generated/(ee|ee-unwind|iop|vu)/|SLUS_207\.72|(^|/)(ram|vram)[^/]*\.bin$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files come from the game and must not be committed:"
            echo "$bad"
            exit 1
          fi
