# Peaks and events on the Select Peak screen (docs/plugins.md, "Peaks and
# events"; docs/plans/plugin-peaks.md). Data only: no menu code. The events all
# play a copy of Snow Jam's world (`BAX`, made by ../world-copy's importer from
# your SSX 3 disc into the cache folder), so every row can be started.
# `tools/plugin_menu_test.py` drives it with scripted pad input.
[plugin]
id = "menu-test"
api = "0.1"
name = "Menu test"

[inputs]
disc = { serials = ["SLUS-20772"] }

[prepare]
# Runs in this folder; ../world-copy is beside it in examples/plugins.
command = ["python3", "prepare/prepare.py"]

# A peak with a picture, race and freestyle events.
[[peak]]
id = "spike"
name = "Peak Spike"
picture = "ui/peak.png"

# A peak whose event has a name from the game's own text table.
[[peak]]
id = "second"
name = "Second Peak"

# A peak with freestyle events only: its goal list has one row.
[[peak]]
id = "styles"
name = "Style Peak"

# A peak with more events than a list holds: the surplus is left out, with a
# line in the log.
[[peak]]
id = "tall"
name = "Tall Peak"

[[event]]
id = "copy"
name = "Copy of Snow Jam"
peak = "spike"
kind = "race"
template = "ARA1"
world = "BAX"

[[event]]
id = "copy2"
name = "Second Copy"
peak = "spike"
kind = "race"
template = "ARA1"
world = "BAX"

[[event]]
id = "style"
name = "Spike Style"
peak = "spike"
kind = "freestyle"
template = "ASS1"
world = "BAX"

