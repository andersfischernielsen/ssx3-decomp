[workspace]
resolver = "2"
members = [
    "crates/ssx3-core",
    "crates/ssx3-ee-rt",
    "crates/ssx3-gs",
    "crates/ssx3-recomp",
    "crates/ssx3-runtime",
    "crates/ssx3-ps2",
    "crates/ssx3-vu",
    "crates/ssx3-iop",
    "crates/ssx3-snd",
    "crates/ssx3-render",
    "crates/ssx3-gfx",
    "crates/ssx3",
    "crates/ssx3-game",
    "generated/ee/*",
    "generated/iop/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andersfischernielsen/ssx3-decomp"

[workspace.dependencies]
ssx3-core = { path = "crates/ssx3-core" }
ssx3-gs = { path = "crates/ssx3-gs" }

[profile.release]
opt-level = 3
lto = "thin"

# Fast-to-build optimized profile for the (very large) generated game code.
[profile.game]
inherits = "release"
lto = false
codegen-units = 64
incremental = true
