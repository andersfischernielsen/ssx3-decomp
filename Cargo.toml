[workspace]
resolver = "2"
members = [
    "crates/ssx3-core",
    "crates/ssx3-gs",
    "crates/ssx3-recomp",
    "crates/ssx3",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/ssx3-decomp"

[workspace.dependencies]
ssx3-core = { path = "crates/ssx3-core" }
ssx3-gs = { path = "crates/ssx3-gs" }

[profile.release]
opt-level = 3
lto = "thin"
