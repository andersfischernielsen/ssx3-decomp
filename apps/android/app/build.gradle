plugins { id 'com.android.application' }
android {
    namespace 'org.ssx3.android'
    compileSdk 34
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId providers.gradleProperty('applicationId').getOrElse('org.ssx3.android')
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    testOptions.unitTests.includeAndroidResources = true
    sourceSets.main.jniLibs.srcDirs = [layout.buildDirectory.dir('rust-jni')]
}
tasks.register('buildRust', Exec) {
    workingDir '../../..'
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '--platform', '33', '-o',
        project.layout.buildDirectory.dir('rust-jni').get().asFile.absolutePath,
        'build', '--locked', '--profile', 'game', '-p', 'ssx3-android', '--lib'
}
tasks.named('preBuild') { dependsOn 'buildRust' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
