[package]
name = "ssx3"
description = "SSX 3 (USA) native recompilation — entry point."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ssx3"
path = "src/main.rs"

[[bin]]
name = "ssx3-headless"
path = "src/bin/ssx3_headless.rs"

[dependencies]
env_logger = "0.11.11"
gilrs = "0.11"
log = "0.4.34"
pollster = "1.0.1"
ssx3-core.workspace = true
ssx3-gs.workspace = true
ssx3-ps2 = { path = "../ssx3-ps2" }
ssx3-ee = { path = "../../generated/ee/game" }
ssx3-game = { path = "../ssx3-game" }
ssx3-iop = { path = "../ssx3-iop" }
ssx3-iop-gen = { path = "../../generated/iop/modules" }
wgpu = "30.0.1"
winit = "0.30.13"
