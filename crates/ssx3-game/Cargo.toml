[package]
name = "ssx3-game"
description = "Hand-written, typed Rust replacements for recompiled SSX 3 functions (phase 2 of docs/plans/roadmap.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

# Depends on the generated crates (to install replacements into their slots);
# they never depend on this crate, so editing it only rebuilds it and relinks.
[dependencies]
ssx3-ee-rt = { path = "../ssx3-ee-rt" }
# The generated EE code: host-thread form (native) or unwind form
# (generated/ee-unwind, single-threaded: the WebAssembly build). The crate
# root aliases the chosen one as `ssx3_ee`.
ssx3-ee-threads = { path = "../../generated/ee/game", package = "ssx3-ee", optional = true }
ssx3-ee-unwind = { path = "../../generated/ee-unwind/game", package = "ssx3-ee-unwind", optional = true }
ssx3-core = { path = "../ssx3-core" }
ssx3-vu = { path = "../ssx3-vu" }
# Draw capture (capture.rs) records `ssx3_render::direct` commands.
ssx3-render = { path = "../ssx3-render" }
ssx3-mpeg = { path = "../ssx3-mpeg" }

# Work packages from docs/investigation/phase2-candidates.md. Each is its own
# module behind a feature so packages can be developed in parallel without
# breaking each other's builds; reviewed packages are added to `default`.
[features]
default = ["packages", "ee-threads"]
packages = ["math", "anim", "camera", "state", "render", "sound", "util", "dispatch", "rider_states", "skeleton", "world", "ai", "ui", "audio", "containers", "chase", "oc1", "oc2", "oc3", "oc4", "oc5", "oc6", "oc7", "oc8", "oc9", "oc10", "oc11", "oc12", "oc13", "oc15", "oc16", "rider_logic", "world_cache", "world_painter", "graphics", "streaming", "replay_script", "oc14", "oc17", "oc18", "oc19", "oc20", "oc21", "oc22", "snd_lib", "audio_system", "oc23", "oc24", "oc25", "oc26", "oc27", "oc28", "oc29", "oc30", "oc31", "oc32", "oc33", "oc34", "oc35", "oc36", "oc39", "oc42", "oc48", "oc51", "oc37", "oc44", "oc50", "oc38", "oc45", "oc43", "oc46", "oc47", "oc49", "oc54", "oc41", "oc53", "oc55", "oc56", "oc60", "oc57", "oc58", "oc59", "oc40", "oc52", "oc62", "oc63", "oc64", "oc65", "oc66", "oc67", "oc68", "oc70", "oc69", "oc71", "oc72", "oc73", "oc74", "oc75", "oc76", "oc78", "oc77", "oc80", "oc79", "oc82", "oc81", "oc85", "oc83", "oc84", "oc86", "oc87", "oc88", "oc89", "oc90", "oc93", "oc92", "oc94", "oc97", "oc98", "oc99", "oc100", "oc91", "oc101", "oc102", "oc104", "oc105", "oc103", "oc106", "oc108", "oc110", "oc107", "oc111", "oc113", "oc112", "oc95", "oc96", "oc115", "oc118", "oc119", "oc116", "oc117", "oc120", "oc121", "oc122", "oc123", "oc124", "oc125", "oc126", "oc127", "oc128", "oc129", "oc131", "oc132", "oc130", "oc133", "oc134", "oc135", "oc136", "oc137", "oc138", "oc139", "oc140", "oc141", "oc142", "oc143", "oc144"]
ee-threads = ["dep:ssx3-ee-threads"]
ee-unwind = ["dep:ssx3-ee-unwind"]
