[package]
name = "ssx3-game"
description = "Hand-written, typed Rust replacements for recompiled SSX 3 functions (phase 2 of docs/plans/roadmap.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# Depends on the generated crates (to install replacements into their slots);
# they never depend on this crate, so editing it only rebuilds it and relinks.
[dependencies]
ssx3-ee-rt = { path = "../ssx3-ee-rt" }
# The generated EE code (the crate root aliases it as `ssx3_ee`).
ssx3-ee-threads = { path = "../../generated/ee/game", package = "ssx3-ee", optional = true }
ssx3-core = { path = "../ssx3-core" }
ssx3-plugin = { path = "../ssx3-plugin" }
ssx3-vu = { path = "../ssx3-vu" }
# Draw capture (capture.rs) records `ssx3_render::direct` commands.
ssx3-render = { path = "../ssx3-render" }
ssx3-mpeg = { path = "../ssx3-mpeg" }
# Plugin peak pictures (game/fe/pluginpic.rs).
png = "0.18.1"

# Work packages from eaaa404^:docs/investigation/phase2-candidates.md. Each is its own
# module behind a feature so packages can be developed in parallel without
# breaking each other's builds; reviewed packages are added to `default`.
[features]
default = ["packages", "ee-threads"]
packages = ["math", "anim", "camera", "state", "render", "sound", "util", "dispatch", "rider_states", "skeleton", "world", "ai", "ui", "audio", "containers", "chase", "rider_logic", "world_cache", "world_painter", "graphics", "streaming", "replay_script", "snd_lib", "audio_system", "oc1501", "oc1502", "oc1503", "oc1504", "oc1505", "oc1506", "oc1507", "oc1508", "oc1509", "oc1510", "oc1511", "oc1512", "oc1513", "oc1514", "oc1515", "oc1516", "oc1517", "oc1518", "oc1519", "oc1520", "oc1460", "oc1461", "oc1462", "oc1463", "oc1464", "oc1465", "oc1466", "oc1467", "oc1468", "oc1469", "oc1470", "oc1471", "oc1472", "oc1473", "oc1474", "oc1475", "oc1476", "oc1477", "oc1478", "oc1479", "oc1480", "oc1481", "oc1482", "oc1483", "oc1484", "oc1485", "oc1486", "oc1487", "oc1488", "oc1489", "oc1490", "oc1491", "oc1492", "oc1493", "oc1494", "oc1495", "oc1496", "oc1497", "oc1498", "oc1499", "oc1500", "oc1521", "oc1522", "oc1523", "oc1524", "oc1525", "oc1526", "oc1527", "oc1528", "oc1529", "oc1530", "oc1531", "oc1532", "oc1533", "oc1534", "oc1535", "oc1536", "oc1537", "oc1538", "oc1539", "oc1540", "oc1541", "oc1542", "oc1543", "oc1544", "oc1545", "oc1546", "oc1547", "oc1548", "oc1549", "oc1550", "oc1551", "oc1552", "oc1553", "oc1554", "oc1555", "oc1556", "oc1557", "oc1558", "oc1559", "oc1560", "oc1561", "oc1562", "oc1563", "oc1564", "oc1565", "oc1566", "oc1567", "oc1568", "oc1569", "oc1570", "oc1571", "oc1572", "oc1573", "oc1574", "oc1575", "oc1576", "oc1577", "oc1578", "oc1579", "oc1580", "oc1581", "oc1582", "oc1583", "oc1584", "oc1585", "oc1586", "oc1587", "oc1588", "oc1589", "oc1590", "oc1591", "oc1592", "oc1593", "oc1594", "oc1595", "oc1596", "oc1597", "oc1598", "oc1599", "oc1600", "oc1601"]
ee-threads = ["dep:ssx3-ee-threads"]
# `SSX3_SHADOW` also compares the calls made and the cycle each starts at
# (build with `--features ssx3-game/shadow-trace`; slows every call).
shadow-trace = ["ssx3-ee-rt/calltrace"]
