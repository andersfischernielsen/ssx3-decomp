[package]
name = "ssx3-game"
description = "Hand-written, typed Rust replacements for recompiled SSX 3 functions (phase 2 of docs/plans/roadmap.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# Depends on the generated crates (to install replacements into their slots);
# they never depend on this crate, so editing it only rebuilds it and relinks.
[dependencies]
ssx3-ee-rt = { path = "../ssx3-ee-rt" }
# The generated EE code (the crate root aliases it as `ssx3_ee`).
ssx3-ee-threads = { path = "../../generated/ee/game", package = "ssx3-ee", optional = true }
ssx3-core = { path = "../ssx3-core" }
ssx3-plugin = { path = "../ssx3-plugin" }
ssx3-vu = { path = "../ssx3-vu" }
# Draw capture (capture.rs) records `ssx3_render::direct` commands.
ssx3-render = { path = "../ssx3-render" }
ssx3-mpeg = { path = "../ssx3-mpeg" }
# Plugin peak pictures (game/fe/pluginpic.rs).
png = "0.18.1"

# Work packages from eaaa404^:docs/investigation/phase2-candidates.md. Each is its own
# module behind a feature so packages can be developed in parallel without
# breaking each other's builds; reviewed packages are added to `default`.
[features]
default = ["packages", "ee-threads"]
packages = ["math", "anim", "camera", "state", "render", "sound", "util", "dispatch", "rider_states", "skeleton", "world", "ai", "ui", "audio", "containers", "chase", "rider_logic", "world_cache", "world_painter", "graphics", "streaming", "replay_script", "snd_lib", "audio_system", "oc1021", "oc1022", "oc1025", "oc1026", "oc1027", "oc1028", "oc1038", "oc1039", "oc1040", "oc1020", "oc1023", "oc1024", "oc1029", "oc1030", "oc1031", "oc1032", "oc1033", "oc1034", "oc1035", "oc1036", "oc1037", "oc1041", "oc1042", "oc1044", "oc1045", "oc1047", "oc1048", "oc1043", "oc1046", "oc1054", "oc1055", "oc1056", "oc1057", "oc1061", "oc1062", "oc1049", "oc1050", "oc1051", "oc1058", "oc1059", "oc1060", "oc1064", "oc1065", "oc1066", "oc1069", "oc1070", "oc1072", "oc1073", "oc1052", "oc1053", "oc1063", "oc1067", "oc1068", "oc1071"]
ee-threads = ["dep:ssx3-ee-threads"]
# `SSX3_SHADOW` also compares the calls made and the cycle each starts at
# (build with `--features ssx3-game/shadow-trace`; slows every call).
shadow-trace = ["ssx3-ee-rt/calltrace"]
math = []
anim = []
camera = []
render = []
sound = []
state = []
util = []
dispatch = []
rider_states = []
skeleton = []
# chase uses camera's typed views.
chase = ["camera"]
ai = []
world = []
ui = []
audio = []
