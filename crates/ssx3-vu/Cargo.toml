[package]
name = "ssx3-vu"
description = "PS2 Vector Units for SSX 3: VU state, pipeline/timing model, per-op semantics, macro mode, and the statically translated VU microcode (generated/vu)."
version.workspace = true
edition.workspace = true
license.workspace = true

# Its own crate so that changes elsewhere in the hardware model (GS, kernel,
# DMA, ...) do not recompile the ~5.5 MB of translated microcode
# (docs/investigation/crate-split.md).
[features]
default = ["microcode"]
# The translated microcode in generated/vu (the game needs it; the recompiler
# and other tools build without it).
microcode = []

[dependencies]
ssx3-ee-rt = { path = "../ssx3-ee-rt" }
