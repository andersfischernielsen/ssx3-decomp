[package]
name = "ssx3-ps2"
description = "PlayStation 2 machine model for running SSX 3: kernel HLE, DMAC, VIF/VU, GS, IPU, SIF/IOP. The EE core it plugs into is ssx3-ee-rt."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ssx3-ee-rt = { path = "../ssx3-ee-rt" }
ssx3-iop = { path = "../ssx3-iop" }
pollster = "1.0.1"
wgpu = "30.0.1"
