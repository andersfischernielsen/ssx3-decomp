[package]
name = "ssx3-ps2"
description = "PlayStation 2 machine model for running SSX 3: kernel HLE, DMAC, VIF/VU, GS, IPU, SIF/IOP. The EE core it plugs into is ssx3-ee-rt."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ssx3-core.workspace = true
ssx3-ee-rt = { path = "../ssx3-ee-rt" }
ssx3-vu = { path = "../ssx3-vu" }
ssx3-iop = { path = "../ssx3-iop" }
ssx3-mc = { path = "../ssx3-mc" }
ssx3-snd = { path = "../ssx3-snd" }
ssx3-render = { path = "../ssx3-render" }
pollster = "1.0.1"
wgpu = "30.0.1"
# std::time on native; performance.now() in the browser.
web-time = "1"
