[package]
name = "ssx3-recomp"
description = "R5900 -> Rust recompilation: function inventory and code generation."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ssx3-core.workspace = true
# Not ssx3-ps2: only the VU op tables/translator are needed, without the
# translated microcode (see docs/investigation/crate-split.md).
ssx3-vu = { path = "../ssx3-vu", default-features = false }
ssx3-iop = { path = "../ssx3-iop" }

[[bin]]
name = "recomp-stats"
path = "src/bin/recomp_stats.rs"

[[bin]]
name = "recomp-gen"
path = "src/bin/recomp_gen.rs"

[[bin]]
name = "recomp-all"
path = "src/bin/recomp_all.rs"

[[bin]]
name = "recomp-ee"
path = "src/bin/recomp_ee.rs"

[[bin]]
name = "recomp-iop"
path = "src/bin/recomp_iop.rs"
