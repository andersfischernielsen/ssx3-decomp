[package]
name = "ssx3-render"
description = "Phase 3 native renderer for SSX 3: the game's per-frame VIF1 DMA chain as typed draws (VU1 calls, GIF streams), for wgpu (docs/investigation/phase3-render.md)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# PS2 float semantics (FMAC/FTOI/DIV/CLIP) shared with the translated
# microcode, for the bit-exact native VU1 programs (mat3.rs). The translated
# microcode itself is not needed here.
ssx3-vu = { path = "../ssx3-vu", default-features = false }

[dev-dependencies]
# The translated microcode, as the reference the native programs are tested
# against (mat3.rs tests replay captured inputs through both).
ssx3-vu = { path = "../ssx3-vu" }
